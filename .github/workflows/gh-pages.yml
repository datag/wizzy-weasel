name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6

    # https://github.com/actions/setup-node/issues/480#issuecomment-1915448139
    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare pnpm@10.0.0 --activate

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Typecheck
      run: pnpm run typecheck

    - name: Build the project
      run: pnpm exec vite build --base=/${{ github.event.repository.name }}/

    - name: Create 404.html
      run: |
        cat <<EOF >dist/404.html
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <title>Seite nicht gefunden</title>
            <script>
                // GitHub Pages has no server-side rewrites. When a client-side route
                // (e.g. /<repo>/game/language-detective) is requested directly, GH Pages
                // serves this file while keeping the original URL. Forward the original
                // route to the SPA entry point via the ?r= query param, which the app
                // then restores and cleans up.
                (function () {
                    var segments = window.location.pathname.split('/');
                    var base = '/' + (segments[1] || '') + '/';
                    var route = segments.slice(2).join('/');
                    if (route) {
                        window.location.replace(base + '?r=' + encodeURIComponent(route));
                    }
                })();
            </script>
            <style>
                body { font-family: sans-serif; text-align: center; padding: 50px; }
                a { color: #24292e; text-decoration: none; font-weight: bold; border: 1px solid #d1d5da; padding: 10px 20px; border-radius: 6px; }
                a:hover { background-color: #f6f8fa; }
            </style>
        </head>
        <body>
            <h1>404 - Hoppla!</h1>
            <p>Die gewünschte Seite wurde nicht gefunden.</p>
            <br>
            <a href="/${{ github.event.repository.name }}/">Zurück zur Startseite</a>
        </body>
        </html>
        EOF

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
